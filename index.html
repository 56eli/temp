<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login</title>
  <style>
    body {
      background: #1a1a1a;
      color: #fff;
      font-family: system-ui, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 30px;
      background: #2a2a2a;
      border-radius: 8px;
      min-width: 300px;
    }
    input {
      padding: 12px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #333;
      color: #fff;
      font-size: 16px;
    }
    button {
      padding: 12px;
      border: none;
      border-radius: 4px;
      background: #667eea;
      color: #fff;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <form action="#" method="post">
    <input type="text" name="username" autocomplete="username" placeholder="Username">
    <input type="password" name="password" autocomplete="current-password" placeholder="Password">
    <button type="submit">Save</button>
  </form>
</body>
</html>
